<section id="overview"><div class="section-head"><div><h2 data-zh="产物成绩，保留选择过程" data-en="Artifact results, with selection preserved"></h2><p data-zh="最终版按每组训练／验证规则选出，回溯高点来自后来补测。五个场景高点来自不同路线，不能当成一次统一方法实验。" data-en="Final artifacts follow their campaign's training/validation rule. Retrospective peaks come from later checkpoint tests. These five artifacts do not constitute one unified-method experiment."></p></div></div><div class="panel table-scroll"><table id="waterlines"></table></div><p class="note" data-zh="WebShop使用严格购买成功率。论文AgentBench每题一次，我们的已发布产物每题三次；Telecom用户模拟器、账户事实与辅助复核权限不同。论文值是参考，不是统一协议的排名。" data-en="WebShop uses strict purchase success. Paper AgentBench uses one trial, our released artifacts use three. Telecom simulator, account facts, and auxiliary review differ. Paper values are reference measurements, not a matched ranking."></p><a id="leaderboard-link" href="#" class="button" data-zh="含AHE等方法的完整对照 →" data-en="Full comparison, including AHE and other methods →"></a></section>
<section id="findings"><h2 data-zh="围绕 DSH，新的判断更具体了" data-en="What the DSH audit makes clearer"></h2><div class="findings">
<div class="finding"><b data-zh="01 · 复杂度增加，收益并不单调" data-en="01 · More machinery is not monotonic progress"></b><p data-zh="L4／L5仍较强。L8确实向下一轮传了经验，但没有稳定收益；L9组件复用有所帮助，却未全面超过旧高点。" data-en="L4/L5 remain strong. L8 delivered experience to later candidates without consistent gains. L9's reuse helped within its cohort but did not dominate earlier results."></p></div>
<div class="finding"><b data-zh="02 · 方法差异，也包含数据协议差异" data-en="02 · Method comparisons also change protocols"></b><p data-zh="DB／Web的L4为300训练、无独立验证，L5为240训练＋60验证；OS的划分又不同。分数差不能全部归因于一个功能。" data-en="DB/Web L4 use 300 training tasks without separate validation; L5 uses 240+60. OS splits differ again. One added feature cannot explain the entire score gap."></p></div>
<div class="finding"><b data-zh="03 · 选择规则会漏掉好产物" data-en="03 · Selection misses useful artifacts"></b><p data-zh="Web旧方法v12补测47.00%，该组最终44.33%；OS L4 v03为39.35%，最终38.89%。这些是事后发现，原最终选择保留。" data-en="Web old-method v12 later tested at 47.00%, versus its campaign final 44.33%. OS L4 v03 reached 39.35%, versus final 38.89%. These are retrospective discoveries."></p></div>
<div class="finding"><b data-zh="04 · 实际生效、目标修复、总体收益分开看" data-en="04 · Execution, intended repair, and global gain differ"></b><p data-zh="有候选涨分，却没有修好计划目标。插件加载或触发只说明执行发生了；具体状态与动作修复仍需配对轨迹支持。" data-en="Some accepted candidates gained overall without repairing their planned targets. Loading or firing proves execution, not benefit. State/action repair still needs paired evidence."></p></div>
<div class="finding" style="grid-column:1/-1"><b data-zh="05 · 平均成功率与重复稳定性可以反向变化" data-en="05 · Average success and repeated reliability can diverge"></b><p data-zh="OS新机制反馈比摘要反馈的平均成功率高（32.87% vs 29.40%），但三次全部成功率略低（25.00% vs 26.39%）；至少一次成功率则更高（40.28% vs 32.64%）。单次搜索显示覆盖扩大，稳定性未同步提高。" data-en="New OS mechanism feedback outscored summary feedback on average success (32.87% vs 29.40%), but all-three success was lower (25.00% vs 26.39%). Any-of-three was higher (40.28% vs 32.64%). This single-search comparison expanded successful coverage without improving repeated reliability."></p></div></div><p class="rule" data-zh="下一步的设计原则：晋升看整体收益，经验看机制是否得到支持，归档看能力是否互补。能力互补Archive仍是待验证方案。" data-en="Next design principle: promote on overall benefit, learn mechanisms supported by evidence, and archive complementary capabilities. A capability-diverse archive remains a proposal."></p></section>
<section id="evolution"><div class="section-head"><div><h2 data-zh="按方法查看完整进化" data-en="Inspect evolution method by method"></h2><p data-zh="选择场景、方法和具体实验。上图是开发成绩，下图只画实际测过的测试点；原最终版和回溯补测分别标记。" data-en="Select a benchmark, method, and run. Development scores appear above; only measured tests appear below. Original final tests and retrospective tests are distinct."></p></div><button id="download" class="button" type="button" data-zh="导出当前曲线 CSV" data-en="Export curve CSV"></button></div>

python evolution/scripts/smoke.py ./workspaces/smoke</pre><p class="note" data-zh="这是脚本模型的离线运行示例，验证DSH钩子及一轮采用链；不是重新取得论文成绩。正式实验另需模型、数据、数据库或任务镜像。" data-en="This scripted-model example exercises DSH hooks and one adoption chain; it does not remeasure benchmark scores. Formal runs need models, data, databases or task images."></p></div><div><h3 data-zh="复现范围明确写出来" data-en="Reproduction coverage is explicit"></h3><p data-zh="产物推理、进化循环、原历史实验是三个层次。ALFWorld／Telecom及反馈扩展尚未全部迁入统一入口，真实依赖与缺口保留在说明中。" data-en="Artifact inference, loop execution, and historical experiment reproduction are different levels. ALFWorld/Telecom and feedback extensions are not all ported into the unified entrypoint; requirements and gaps are documented."></p><p data-zh="发布新的Harness时附上配置、曲线与实测记录，再构建榜单。旧版本和原选择不覆盖；网页是一份注明采集日期的数据快照。" data-en="Publish a new harness with its configuration, curve and measurements, then rebuild. Preserve old versions and original selections. This view is a dated snapshot."></p><a class="button" id="repro-link" href="#" data-zh="代码与复现步骤 →" data-en="Code and reproduction steps →"></a> <a class="button" id="data-link" href="#" data-zh="详细数据 →" data-en="Detailed data →"></a></div></div></section>

<script>
const DATA=JSON.parse(document.getElementById('research-data').textContent),BASE='https://github.com/HuangShengZeBlueSky/dsh-harness-evolution',NAMES={alfworld:'ALFWorld',dbbench:'DBBench',webshop:'WebShop',osbench:'OSBench',telecom:'Telecom'};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh',current=null;
const $=id=>document.getElementById(id),tr=(zh,en)=>lang==='zh'?zh:en,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=x=>x==null?'—':(x*100).toFixed(2)+'%',num=x=>x==null||!Number.isFinite(Number(x))?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:1}),link=p=>BASE+'/blob/main/'+p,method=g=>DATA.methods.find(m=>m.id===g.method_id),label=m=>m?(m['label_'+lang]||m.id):'',metric=(label,value)=>`<div><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`;
function translate(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=e.dataset[lang]);$('language').textContent=tr('English','简体中文');$('docs-link').href=link('docs/METHODS'+(lang==='zh'?'.zh-CN':'')+'.md');$('leaderboard-link').href=link('LEADERBOARD'+(lang==='zh'?'.zh-CN':'')+'.md');$('repro-link').href=link('docs/REPRODUCING'+(lang==='zh'?'.zh-CN':'')+'.md');$('data-link').href=BASE+'/tree/main/results/research';$('counts').innerHTML=`<span><strong>5</strong>${tr('场景','benchmarks')}</span><span><strong>${DATA.methods.length}</strong>${tr('方法定义','method definitions')}</span><span><strong>${DATA.groups.length}</strong>${tr('实验曲线','run records')}</span><span>${tr('采集于','Collected')} ${esc(DATA.updated.slice(0,16).replace('T',' '))} UTC</span>`;waterlines();catalog();}
function waterlines(){const life=DATA.paper.methods.find(m=>m.id==='life');$('waterlines').innerHTML='<thead><tr>'+[tr('场景','Benchmark'),tr('最佳已发布最终版','Best released final'),tr('回溯已晋升高点','Retrospective promoted peak'),'Life-Harness v3',tr('覆盖','Coverage')].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+Object.keys(NAMES).map(b=>{const f=DATA.board.champions[b],w=DATA.board.best_measured[b],retro=w.selection_kind==='retrospective_adopted';return `<tr><td><b>${NAMES[b]}</b><small>${esc(f.method_en||f.method)}</small></td><td><a href="${BASE+'/tree/main/'+f.artifact}"><strong>${pct(f.metrics.pass_at_1)}</strong></a><small>${esc(f.checkpoint)}</small></td><td>${retro?`<a href="${BASE+'/tree/main/'+w.artifact}">${pct(w.metrics.pass_at_1)}</a><small>${esc(w.checkpoint)} · ${tr('事后补测','retrospective')}</small>`:'—'}</td><td>${pct(life.pass_at_1[b])}</td><td>${f.coverage.tasks} × ${f.coverage.repeats}<small>${num(f.coverage.valid_episodes)} ${tr('有效场次','valid episodes')}</small></td></tr>`}).join('')+'</tbody>';}
function fillMethods(preferred){const bench=$('bench').value,ids=[...new Set(DATA.groups.filter(g=>g.benchmark===bench).map(g=>g.method_id))];$('method').innerHTML=`<option value="">${tr('全部方法','All methods')}</option>`+ids.map(id=>`<option value="${esc(id)}">${esc(label(DATA.methods.find(m=>m.id===id))||id)}</option>`).join('');$('method').value=ids.includes(preferred)?preferred:'';fillRuns();}
function fillRuns(preferred){let gs=DATA.groups.filter(g=>g.benchmark===$('bench').value&&(!$('method').value||g.method_id===$('method').value));gs.sort((a,b)=>(a.collection==='historical')-(b.collection==='historical')||a.id.localeCompare(b.id));$('run').innerHTML=gs.map(g=>`<option value="${esc(g.id)}">${esc(label(method(g))||g.method_label||g.method_id)} · ${esc(g.model)} · ${esc(g.start||'')} · ${esc(g.id.split('/').slice(-1)[0])}</option>`).join('');let d=preferred&&gs.find(g=>g.id===preferred);if(!d)d=gs.find(g=>g.method_id==='L4'&&g.id.includes('l4-h0-sol61'))||gs[0];$('run').value=d?.id||'';selectRun();}
function selectRun(){current=DATA.groups.find(g=>g.id===$('run').value);if(!current)return;const g=current,m=method(g),d=g.detail;$('run-title').textContent=NAMES[g.benchmark]+' · '+(label(m)||g.method_label||g.method_id);$('run-subtitle').textContent=[g.model,g.start,`${g.rounds??'?'} / ${g.budget??'?'} ${tr('轮','rounds')}`,g.best?tr('选定 ','Selected ')+g.best:''].filter(Boolean).join(' · ');$('run-status').textContent=g.status==='final_test_complete'?tr('最终测试完整','Final test complete'):g.status;$('method-description').textContent=m?.['one_line_'+lang]||tr('历史方法记录；具体起点和选择依据请查看原始配置。','Historical record: inspect its starting point and selection protocol.');let steps=m?.['steps_'+lang]||[tr('准备证据','Prepare evidence'),tr('生成候选','Propose'),tr('评测','Evaluate'),tr('采用／拒绝','Decide')];$('method-flow').innerHTML=steps.map(x=>'<span>'+esc(x)+'</span>').join('');$('method-rule').textContent=m?.['rule_'+lang]||tr('规则以该次实验配置为准。','The recorded campaign configuration defines its rule.');$('method-links').innerHTML=`<a href="${link('docs/METHODS'+(lang==='zh'?'.zh-CN':'')+'.md')}">${tr('详细方法与边界','Method details and limits')} ↗</a>`+(d?` · <a href="${link('results/research/'+d.configuration_file)}">${tr('本组配置','Run configuration')}</a> · <a href="${link('results/research/'+d.task_manifest_file)}">${tr('任务编号与种子','Task IDs and seeds')}</a>`:'');if(g.artifact)$('method-links').innerHTML+=` · <a href="${BASE+'/tree/main/'+g.artifact}">${tr('本组最终Harness源码与框图','Final harness source and diagram')}</a>`;const strict=g.benchmark==='webshop'&&g.points.some(p=>p.training_strict!=null);$('dev-metric').value=strict?'strict':'mean';$('dev-metric').options[1].disabled=!strict;renderCharts();renderMetrics();renderRounds();}
function svgChart(series,points){const W=700,H=245,L=47,R=18,T=15,B=35,xmax=Math.max(1,current.budget||0,...points.map(p=>p.round||0)),x=r=>L+(W-L-R)*r/xmax,y=v=>H-B-(H-T-B)*v;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recorded evolution curve">`;for(let v=0;v<=1.001;v+=.25){s+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e8eef3"/><text x="${L-9}" y="${y(v)+4}" fill="#718193" font-size="10" text-anchor="end">${Math.round(v*100)}</text>`;}for(let r=0;r<=xmax;r+=Math.max(1,Math.ceil(xmax/8))){s+=`<text x="${x(r)}" y="${H-12}" text-anchor="middle" fill="#718193" font-size="10">${r}</text>`;}for(const a of series){const ps=a.values.filter(p=>p.v!=null&&Number.isFinite(p.v));if(a.line&&ps.length>1)s+=`<path d="${ps.map((p,i)=>(i?'L':'M')+x(p.r)+','+y(p.v)).join(' ')}" fill="none" stroke="${a.color}" stroke-width="1.8"/>`;for(const p of ps){let title=`${p.version||p.r}: ${pct(p.v)}${p.kind?' · '+p.kind:''}`;s+=`<circle cx="${x(p.r)}" cy="${y(p.v)}" r="${a.radius||3.5}" fill="${a.hollow?'#fff':a.color}" stroke="${a.color}" stroke-width="1.8"><title>${esc(title)}</title></circle>`;}}s+=`<text x="${W-R}" y="${H-12}" text-anchor="end" fill="#718193" font-size="10">${tr('轮次','round')}</text></svg>`;return s;}
function renderCharts(){let ps=current.points,strict=$('dev-metric').value==='strict',trainKey=strict?'training_strict':'after',valKey=strict?'validation_strict':'validation';const vals=key=>ps.map(p=>({r:p.round,v:p[key],version:p.version}));$('development-chart').innerHTML=svgChart([{values:vals(trainKey),color:'#ac621d',line:true},{values:vals(valKey),color:'#315ecb',line:true},{values:ps.filter(p=>p.adopted).map(p=>({r:p.round,v:p[trainKey],version:p.version,kind:'adopted'})),color:'#067e69',radius:4.5,hollow:true}],ps);$('development-legend').innerHTML=`<span><i style="background:#ac621d"></i>${strict?tr('训练严格成功','Train strict success'):current.benchmark==='webshop'?tr('训练平均奖励','Train mean reward'):tr('训练成功','Train success')}</span><span><i style="background:#315ecb"></i>${strict?tr('验证严格成功','Validation strict success'):current.benchmark==='webshop'?tr('验证平均奖励','Validation mean reward'):tr('验证成功','Validation success')}</span><span><i style="background:white;border:2px solid #067e69"></i>${tr('采用','Adopted')}</span>`;let tests=[],retro=[],final=[];for(const p of ps){let v=current.benchmark==='webshop'?p.strict_test:p.test;if(v!=null)tests.push({r:p.round,v,version:p.version});let q=p.independent_test;if(q){let v=current.benchmark==='webshop'?q.strict_test:q.test;if(v!=null)retro.push({r:p.round,v,version:p.version});}if(p.final_test!=null)final.push({r:p.round,v:p.final_test,version:p.version});}if(!final.length&&current.complete&&current.test!=null&&current.best){let p=ps.find(p=>p.version===current.best);if(p)final.push({r:p.round,v:current.test,version:p.version});}$('test-chart').innerHTML=tests.length||retro.length||final.length?svgChart([{values:tests,color:'#315ecb',radius:4},{values:retro,color:'#ac621d',hollow:true,radius:5.3},{values:final,color:'#067e69',radius:5.5}],ps):'<div class="empty">'+tr('尚无完整测试结果；不以训练分替代。','No complete test measurement; training is not substituted.')+'</div>';}
function renderMetrics(){const g=current,d=g.detail,t=d?.final_test,known=t?.strict_pass_at_1??g.test;$('metrics').innerHTML=metric(d?.final_selection?.best||g.complete?tr('最终测试成功','Final test success'):tr('已记录测试','Recorded test'),pct(known))+metric(tr('有效／计划场次','Valid / planned'),t?`${t.valid_episodes} / ${t.expected_episodes}`:'—')+metric(tr('采用候选','Adopted candidates'),d?`${d.adopted_candidates} / ${d.decisions_completed}`:'—')+metric(tr('重复间标准差','Across-trial standard deviation'),t?.strict_repeat_population_std!=null?(100*t.strict_repeat_population_std).toFixed(2)+' pp':'—')+metric(tr('三次至少一次成功','Observed any-of-three'),pct(t?.observed_any_success_3))+metric(tr('三次全部成功','Observed all-of-three'),pct(t?.observed_all_success_3));let repeats=t?.per_repeat||[];$('repeat-table').innerHTML=repeats.length?'<table class="mini"><tr><th>'+tr('重复','Trial')+'</th><th>'+tr('成功／有效','Success / valid')+'</th><th>'+tr('严格成功率','Strict success')+'</th></tr>'+repeats.map(r=>`<tr><td>${r.trial}</td><td>${r.strict_successes} / ${r.episodes}</td><td>${pct(r.strict_success_rate)}</td></tr>`).join('')+'</table>':'';if(!d){$('run-config').innerHTML='<p class="note">'+tr('历史曲线已公开；完整重复统计未统一到此数据集，未提供的字段不猜测。','Historical curves are published. Full repeat-level statistics are not normalized here; missing fields are not inferred.')+'</p>';return;}const rt=t?.runtime||{};let stats=[[tr('无效尝试','Invalid attempts'),num(t?.invalid_attempts)],[tr('每场平均模型请求','Mean requests / episode'),num(rt.requests?.mean)],[tr('每场平均环境动作','Mean actions / episode'),num(rt.environment_actions?.mean)],[tr('每场平均耗时（秒）','Mean episode seconds'),num(rt.elapsed_seconds?.mean)],[tr('首末决定间隔（小时）','First-to-last decision span (h)'),num(d.efficiency?.first_to_last_decision_seconds==null?null:d.efficiency.first_to_last_decision_seconds/3600)],[tr('独立搜索次数','Independent searches'),d.independent_search_repetitions],[tr('优化器Token','Optimizer tokens'),d.efficiency?.optimizer_tokens??tr('未汇总','Not consolidated')]];let counts=Object.entries(d.split_counts||{}).map(([k,v])=>`${k}: ${v.tasks} tasks / ${v.episodes} episodes`).join('\n');$('run-config').innerHTML='<details open><summary>'+tr('执行统计','Execution statistics')+'</summary><table class="mini">'+stats.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')+'</table></details><details><summary>'+tr('模型、划分与选择规则','Models, splits and selection')+'</summary><pre>'+esc(JSON.stringify({actor:d.actor,optimizer:d.optimizer,user_simulator:d.user_simulator,learning_model:d.learning_model,start:d.startpoint,splits:d.split_counts,budget:d.candidate_budget,protocol:d.protocol,selection:d.selection_rule},null,2))+'</pre></details>'+(t?'<details><summary>'+tr('运行时干预统计','Runtime intervention statistics')+'</summary><pre>'+esc(JSON.stringify(rt,null,2))+'</pre><p class="note">'+tr('触发次数不代表收益，执行时间总和不代表墙钟耗时。','Trigger counts do not establish gains; aggregate elapsed time is not wall-clock time.')+'</p></details>':'');}
function renderRounds(){const ps=current.points.filter(p=>p.round>0);$('round-table').innerHTML='<thead><tr>'+[tr('轮次／版本','Round / version'),tr('父版','Parent'),tr('采用','Adopted'),tr('训练均值','Train mean'),tr('验证','Validation'),tr('修复／退步','Repaired / regressed'),tr('计划目标修复','Planned-target repairs')].map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+ps.map(p=>`<tr><td>${p.round} · ${esc(p.version)}</td><td>${esc(p.parent||'—')}</td><td>${p.adopted===true?tr('采用','Yes'):p.adopted===false?tr('拒绝','No'):'—'}</td><td>${pct(p.after)}</td><td>${pct(p.validation)}</td><td>${num(p.paired?.repaired)} / ${num(p.paired?.regressed)}</td><td>${num(p.planned_target_repairs)}</td></tr>`).join('')+'</tbody>';}
function catalog(){$('method-catalog').innerHTML=DATA.methods.map(m=>`<div class="method-item"><b>${esc(label(m))}</b><p>${esc(m['one_line_'+lang]||'')}</p><small>${esc(m.reproduction_status||m.status||'')}</small></div>`).join('');}
$('language').onclick=()=>{const mid=$('method').value,id=$('run').value;lang=lang==='zh'?'en':'zh';translate();fillMethods(mid);fillRuns(id)};$('bench').onchange=()=>fillMethods('');$('method').onchange=()=>fillRuns();$('run').onchange=selectRun;$('dev-metric').onchange=renderCharts;$('download').onclick=()=>{if(!current)return;let columns=['round','version','parent','adopted','after','training_strict','validation','validation_strict','test','strict_test','retrospective_test','retrospective_strict_test'];let csv=[columns.join(','),...current.points.map(p=>columns.map(k=>k==='retrospective_test'?(p.independent_test?.test??''):k==='retrospective_strict_test'?(p.independent_test?.strict_test??''):(p[k]??'')).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=current.id.replaceAll('/','--')+'.csv';a.click();URL.revokeObjectURL(a.href)};
$('bench').innerHTML=Object.keys(NAMES).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('');$('bench').value='dbbench';translate();fillMethods('L4');
</script></body></html>
