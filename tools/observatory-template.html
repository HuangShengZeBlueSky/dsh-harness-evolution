<section id="cost"><div class="section-head"><div><div class="eyebrow">03 / BUDGET & MODEL CAPABILITY</div><h2 data-zh="效果之外，也看用了多少" data-en="Performance with a cost ledger"></h2><p data-zh="优化Token来自真实调用记录。缓存输入已包含在总输入内，推理输出已包含在输出内；不重复相加，也不直接换算成订阅额度或金额。" data-en="Optimizer tokens come from actual usage records. Cached input is a subset of input, reasoning a subset of output. Neither is added twice or converted into subscription quota or currency."></p></div></div>
<div class="two"><div class="panel"><h3 data-zh="当前所选实验的优化用量" data-en="Usage of selected runs"></h3><div id="token-summary" class="token-summary"></div><div id="token-table" class="table-scroll"></div><p class="note" data-zh="用量包含优化会话内的读取、生成和等待轮询；不包含Qwen做题评测或继承起点的历史成本。独立经验学习调用另列。缺少逐轮用量时，仅提供总量，不按轮数摊分。" data-en="Usage includes reading, generation and polling within optimizer sessions; actor evaluations and inherited prior-search costs are excluded. Learning calls are separate. Missing round-level costs are not distributed artificially."></p></div><div class="panel"><h3 data-zh="最终成绩—优化成本" data-en="Final outcome versus optimizer cost"></h3><div id="cost-chart" class="chart"></div><p class="note" data-zh="每点是已选定版本的最终测试与已记录的优化成本（含可追溯的经验调用）；不同协议保留身份，不强行拟合缩放定律。" data-en="Each point is a selected final and observed optimization cost, including recorded learning calls. Protocol differences remain; no scaling law is fitted."></p></div></div>
<div class="panel" style="margin-top:18px"><h3 data-zh="同一简化loop：优化模型与推理强度" data-en="Same simplified loop: optimizer model and reasoning effort"></h3><div id="model-matrix" class="table-scroll"></div><p class="note" data-zh="固定训练集、40轮（Telecom为74题，其余100题）；只展示完成的最终测试，未完成不填零。模型差异支持研究能力与修改空间的关系，但当前成绩不呈现所有场景上的单调模型排名。" data-en="Fixed training sets and 40 rounds: 74 tasks for Telecom, 100 elsewhere. Only completed final tests are shown; unfinished is not zero. These observations motivate model-capability studies but do not show a monotonic model ranking on every benchmark."></p></div></section>
<section id="papers"><div class="section-head"><div><div class="eyebrow">04 / PAPER REFERENCES</div><h2 data-zh="论文也看曲线、Token与稳定性" data-en="Paper curves, token costs and reliability"></h2><p data-zh="Life-Harness附录给出Meta-Harness、AHE和Life-Harness的六轮记录。下图全部是论文训练批次成绩，与上面的测试曲线分开。" data-en="Life-Harness publishes six-round records for Meta-Harness, AHE and Life-Harness. The chart below contains paper training-batch scores, separate from the held-out test curves above."></p></div><a href="https://arxiv.org/html/2605.22166v3#A2.T12" class="citation" target="_blank">Table 12 ↗</a></div><div class="two"><div class="panel"><div class="controls"><h3 data-zh="论文六轮记录" data-en="Six paper evolution rounds"></h3><select id="paper-axis" aria-label="Paper x axis"><option value="tokens" data-zh="累计优化Token" data-en="Cumulative tokens"></option><option value="round" data-zh="轮次" data-en="Rounds"></option></select></div><div id="paper-chart" class="chart"></div><div id="paper-legend" class="legend"></div><p class="note" data-zh="做题模型Qwen3-4B，优化模型GPT-5.5。各轮任务批次变化，折线仅展示原始记录；论文Token不提供缓存拆分。" data-en="Qwen3-4B actor, GPT-5.5 optimizer. Batches change across rounds; lines present reported records. Paper token costs have no cache breakdown."></p></div><div class="panel"><h3 data-zh="当前场景的多指标对照" data-en="Multiple metrics for this benchmark"></h3><div id="paper-metrics" class="table-scroll"></div><details><summary data-zh="Telecom：历史版本与公开产物复测" data-en="Telecom: historical versions and public-artifact reruns"></summary><div id="telecom-history"></div></details></div></div><details class="panel"><summary data-zh="更多相关方法：哪些能直接比，哪些只比思路" data-en="More related methods: direct comparisons versus methodological references"></summary><div id="related"></div></details></section>
<section id="coverage"><div class="section-head"><div><div class="eyebrow">05 / CHECKPOINT COVERAGE</div><h2 data-zh="晋升过的检查点，测齐了吗？" data-en="Were promoted checkpoints actually tested?"></h2><p data-zh="补测使用冻结产物，结果不回流优化器。正在进化的实验先完成原有选版，再补历史晋升点。" data-en="Backfills evaluate frozen artifacts without feeding tests to optimizers. Active searches finish their original selection before retrospective checkpoint testing."></p></div></div><div id="queue-summary" class="callout"></div><div class="panel table-scroll" style="margin-top:15px"><table id="coverage-table"></table></div></section>
<section id="method"><div class="section-head"><div><div class="eyebrow">06 / THE METHOD</div><h2 data-zh="扩大修改空间，复用成熟底座" data-en="Scale the editable space; reuse the runtime"></h2><p data-zh="智能提升能否支持更复杂的机制修改，是我们的核心研究问题。DSH提供已有生命周期、工具和插件接口，让优化器把精力放在机制上。" data-en="Our central question is whether more capable optimizers can exploit more complex mechanism edits. DSH supplies lifecycle, tool and plugin interfaces so the optimizer can focus on the mechanism."></p></div></div><div class="panel"><div class="flowline"><span data-zh="提示词" data-en="Prompts"></span><span>Skill</span><span data-zh="工具与接口" data-en="Tools & interfaces"></span><span data-zh="状态与控制" data-en="State & control"></span><span data-zh="完整Harness" data-en="Full harness"></span></div><p class="method-text" data-zh="L4先维护当前Agent的能力与插件职责，再依据轨迹提出修复假设，复用已有接口完成必要的联合机制，评测后保留有效版本。扩大可修改范围、单次机制复杂度与行为影响范围是不同变量；不能仅凭插件多或代码长就说机制更强。" data-en="L4 first describes the current agent’s capabilities and plugin responsibilities, then uses trajectories to propose repairs and implements coherent mechanisms through existing interfaces. Broader editable scope, mechanism complexity and behavioral impact are different variables; more plugins or code do not alone establish stronger mechanisms."></p><p class="callout" data-zh="已有多模型实验展示差异；“能力涌现”作为待检验解释，不写成已由所有场景一致证明的定律。DSH减少认知负担是设计动机，其独立收益仍需有／无相应支持的对照。" data-en="Existing optimizer comparisons show differences. Capability emergence remains a hypothesis, not a law established across every benchmark. Reducing cognitive burden through DSH is a design motivation; its independent effect requires a corresponding control."></p><div class="linkrow"><a href="../docs/SCALING-METHOD.zh-CN.md" data-zh="中文方法 ↗" data-en="Chinese method ↗"></a><a href="../docs/SCALING-METHOD.md">English method ↗</a><a href="../results/research/README.md" data-zh="研究数据与指标 ↗" data-en="Research data & metrics ↗"></a><a href="research.html" data-zh="原逐组研究详情 ↗" data-en="Original run-by-run explorer ↗"></a><a href="architecture.html" data-zh="四模块架构 ↗" data-en="Architecture ↗"></a></div></div></section>
