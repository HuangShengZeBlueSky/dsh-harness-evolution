<header class="hero"><div class="eyebrow">PAPER · CODE · MEASURED HARNESSES</div><h1 data-zh="让轨迹成为可执行的改进。" data-en="From trajectories to executable improvements.">让轨迹成为可执行的改进。</h1><p data-zh="冻结执行模型，在 DeepSeek Harness 上研究 L4 插件进化与 A/B/C 修改面。查看实际产物、测试成绩，以及每个结果背后的配置和曲线。" data-en="Freeze the executor. Study L4 plugin evolution and A/B/C editable scopes on DeepSeek Harness. Explore measured artifacts, test results, configurations and trajectories."></p><div class="links"><a href="https://github.com/HuangShengZeBlueSky/dsh-harness-evolution">GitHub ↗</a><a href="https://github.com/HuangShengZeBlueSky/dsh-harness-evolution/tree/main/configs" data-zh="复现配置 ↗" data-en="Run configurations ↗"></a><a href="paper/data/main-results.json" data-zh="论文主表数据 ↓" data-en="Paper table data ↓"></a></div></header>
<div class="cards" id="cards"></div>
<section class="section" id="results"><h2 data-zh="论文主榜" data-en="Paper leaderboard"></h2><p data-zh="显示测试成功率。历史最高测点与开发阶段最终选版各有记录，文献成绩保留原协议。" data-en="Test success rates. Measured peaks and development-selected outputs retain their identities; literature results retain their source protocols."></p><div class="controls" id="table-filter"></div><div class="panel scroll"><table id="leaderboard"></table></div><p class="note" data-zh="WebShop 历史与冻结商品环境分列。OSBench 主表保留历史 C 的 39.35%，另一个题单的 C 高点 41.67% 可在曲线中查看。误差为逐遍样本标准差。Telecom 本地采用 GLM 用户模拟器。" data-en="WebShop historical and frozen catalogs have separate columns. OSBench retains historical C at 39.35%; the separate data-control peak of 41.67% remains in the curves. Error is sample SD across repeats. Local Telecom uses a GLM user."></p></section>
<section class="section" id="curves"><h2 data-zh="每个格子背后的进化曲线" data-en="Trajectories behind the cells"></h2><p data-zh="四个场景，每个场景有一张八组 C 配置曲线和一张九组模型×修改面曲线。训练、实测测试点与误差沿用论文原图。" data-en="Four benchmarks, each with eight C configurations and nine model-by-scope panels. Training, measured tests and uncertainty follow the paper figures."></p><div class="controls" id="bench-tabs"></div><div class="controls" id="curve-tabs"></div><div class="panel curve" id="curve"></div><details><summary data-zh="同协议 A/B/C 的终选成绩" data-en="Final-selected outcomes from matched A/B/C searches"></summary><div class="panel scroll"><table id="controlled"></table></div><p class="note" data-zh="这里是四十轮同协议 Sol high 对照。上面的九面板图沿用论文的历史产物对照，C 产物的训练配置见曲线清单。" data-en="This table shows the matched 40-round Sol-high runs. The nine-panel paper figures retain the historical artifact comparison; C configurations are listed in the curve manifest."></p></details><a href="paper/data/curve-manifest.json" data-zh="曲线与配置对应表 ↓" data-en="Curve-to-configuration manifest ↓"></a> · <a href="paper/data/trajectories.json" data-zh="逐轮曲线数据 ↓" data-en="Trajectory data ↓"></a></section>
<section class="section" id="method"><h2 data-zh="两条主线，共同运行层" data-en="Two methods, one runtime"></h2><div class="method"><div class="card"><h3>L4</h3><p data-zh="先梳理当前 Agent 的能力与插件职责，再依据训练轨迹生成插件改动，配对评测后晋升。" data-en="Describe current capabilities and plugin responsibilities, then generate trajectory-guided edits and select through paired evaluation."></p><a href="https://github.com/HuangShengZeBlueSky/dsh-harness-evolution/tree/main/configs/l4">L4 configurations ↗</a></div><div class="card"><h3>A / B / C</h3><p data-zh="A 修改技能文本。B 每轮修改一个独立部件。C 允许机制通过任务内状态协调多个钩子。统一四十轮，封存后测试晋升版。" data-en="A edits skill text. B edits one independent component per round. C allows mechanisms to coordinate hooks through episode state. Forty decisions precede frozen-checkpoint tests."></p><a href="https://github.com/HuangShengZeBlueSky/dsh-harness-evolution/tree/main/configs/abc">A/B/C configurations ↗</a></div></div><p><a href="https://github.com/HuangShengZeBlueSky/dsh-harness-evolution/blob/main/docs/REPRODUCING.md" data-zh="安装、环境与复现步骤 ↗" data-en="Installation, environments and reproduction ↗"></a></p><div class="panel figure"><a href="paper/figures/abc-search-procedure.pdf"><img src="paper/previews/abc-search-procedure.png" alt="A/B/C algorithm"></a></div></section>

</main>
<script>
const DATA=__DATA__;
const repo='https://github.com/HuangShengZeBlueSky/dsh-harness-evolution';
let lang=new URLSearchParams(location.search).get('lang')||'zh', bench='alfworld',type='abc',filter='all';
const names={alfworld:'ALFWorld',dbbench:'DBBench',webshop:'WebShop',osbench:'OSBench',telecom:'Telecom',webshop_historical:'WebShop · hist.',webshop_frozen:'WebShop · frozen'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(s){return s?s.mean.toFixed(2)+(s.sd==null?'':' ± '+s.sd.toFixed(2)):'—'}
function draw(){
document.documentElement.lang=lang;
document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=e.dataset[lang]);
document.getElementById('lang').textContent=lang==='zh'?'English':'中文';
const top=DATA.leaderboard.rows[0];
document.getElementById('cards').innerHTML=['alfworld','dbbench','webshop_frozen','osbench','telecom'].map(b=>'<div class="card"><strong>'+names[b]+'</strong><div class="value">'+top.scores[b].mean.toFixed(2)+'%</div><div class="caption">'+(lang==='zh'?'论文历史产物 · 已测高点':'Paper artifact · measured peak')+'</div></div>').join('');
document.getElementById('table-filter').innerHTML=['all','local','paper'].map((x,i)=>'<button class="tab '+(filter===x?'active':'')+'" onclick="filter=\''+x+'\';draw()">'+(lang==='zh'?['全部','本地测量','文献报告'][i]:['All','Local','Literature'][i])+'</button>').join('');
document.getElementById('leaderboard').innerHTML='<thead><tr><th>Method</th>'+DATA.leaderboard.columns.map(c=>'<th>'+names[c]+'</th>').join('')+'</tr></thead><tbody>'+DATA.leaderboard.rows.filter(r=>filter==='all'||r.group===filter).map(r=>'<tr class="'+(r.method.startsWith('Ours')?'ours':r.group==='paper'?'report':'')+'"><td>'+esc(r.method)+'</td>'+DATA.leaderboard.columns.map(c=>'<td>'+fmt(r.scores[c])+'</td>').join('')+'</tr>').join('')+'</tbody>';
document.getElementById('bench-tabs').innerHTML=['alfworld','dbbench','webshop','osbench'].map(b=>'<button class="tab '+(bench===b?'active':'')+'" onclick="bench=\''+b+'\';draw()">'+names[b]+'</button>').join('');
document.getElementById('curve-tabs').innerHTML=['abc','c'].map(t=>'<button class="tab '+(type===t?'active':'')+'" onclick="type=\''+t+'\';draw()">'+(t==='abc'?(lang==='zh'?'模型 × 修改面 · 9 组':'Model × scope · 9 panels'):(lang==='zh'?'C 模型与推理强度 · 8 组':'C model & effort · 8 panels'))+'</button>').join('');
const f=DATA.figures.find(f=>f.id===type+'-curves-'+bench);
document.getElementById('curve').innerHTML='<div class="bar"><strong>'+names[bench]+' · '+f.panels+' panels</strong><a href="paper/'+f.file+'" target="_blank">PDF ↗</a></div><a href="paper/'+f.file+'" target="_blank"><img src="paper/'+f.preview+'" alt="'+f.title+'"></a>';
document.getElementById('controlled').innerHTML='<tr><th>Benchmark</th><th>A</th><th>B</th><th>C</th></tr>'+['alfworld','dbbench','webshop','osbench'].map(b=>'<tr><td>'+names[b]+'</td>'+['A','B','C'].map(s=>{const x=DATA.controlled.find(x=>x.benchmark===b&&x.arm===s+'-sol61');return '<td>'+(x?.final?.test?(100*x.final.test.strict_success).toFixed(2):'—')+'</td>'}).join('')+'</tr>').join('');
document.getElementById('gallery').innerHTML=DATA.figures.filter(f=>!f.panels&&f.id!=='abc-search-procedure').map(f=>'<a class="panel figure" href="paper/'+f.file+'" target="_blank"><img loading="lazy" src="paper/'+f.preview+'" alt="'+esc(f.title)+'"><h3>'+esc(f.title)+' ↗</h3></a>').join('');
document.getElementById('artifacts-list').innerHTML=DATA.artifacts.map(a=>'<a class="card" href="'+repo+'/tree/main/'+a.path+'"><h3>'+names[a.benchmark]+'</h3><span class="caption">'+esc(a.name)+' ↗</span></a>').join('');
}
document.getElementById('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';draw()};draw();
</script>
</html>
