[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dsh-autoharness"
version = "0.1.0"
description = "Shared DSH runtime and selectable AutoHarness evolution loops"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3"]
[project.optional-dependencies]
dbbench = ["mysql-connector-python>=9,<10"]
alfworld = ["alfworld==0.4.2", "textworld[pddl]==1.7.0", "spacy==3.7.5", "numpy==1.26.4", "nltk", "tqdm", "termcolor"]
plots = ["matplotlib>=3.8"]
[project.scripts]
dsh-evolve = "dsh_evolve.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
astra_evolve = ["assets/*", "assets/runtime/*", "assets/example-plugins/*"]
