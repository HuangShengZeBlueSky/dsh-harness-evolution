domain: alfworld
node: node
baseline: baseline
runtime: runtime
output: runs
benchmark:
  kind: python
  test: test.jsonl
  direction: maximize
  success_score: 1
  concurrency: 5
  max_steps: 50
  max_model_calls: 50
  timeout_seconds: 1500
  no_tool_feedback: "You MUST call the take_action tool \u2014 do NOT output plain\
    \ text without a tool call."
  model:
    name: Qwen3-4B-Instruct-2507
    base_url: ${BENCH_BASE_URL}
    api_key_env: BENCH_API_KEY
    temperature: 0
    max_tokens: 4096
    timeout_seconds: 180
    max_retries: 2
    send_seed: false
    extra_body:
      parallel_tool_calls: false
  environment:
    factory: environment.py:create_environment
    data_root: ${ALFWORLD_DATA_ROOT}
    system_prompt_file: system-prompt.txt
  runner: alfworld
name: alfworld-frozen
mode: frozen
checkpoint: v06
harness_api: interface.md
test_schedule: artifact
