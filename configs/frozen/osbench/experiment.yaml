domain: osbench
node: node
baseline: baseline
runtime: runtime
output: runs
benchmark:
  kind: python
  test: test.jsonl
  direction: maximize
  success_score: 1
  concurrency: 4
  max_steps: 16
  max_model_calls: 16
  timeout_seconds: 900
  no_tool_feedback: No tool call detected. Please call a tool.
  model:
    name: Qwen3-4B-Instruct-2507
    base_url: ${BENCH_BASE_URL}
    api_key_env: BENCH_API_KEY
    temperature: 0
    max_tokens: 4096
    timeout_seconds: 575
    max_retries: 0
    send_seed: true
    extra_body:
      parallel_tool_calls: false
  environment:
    factory: environment.py:create_environment
    docker_host: ${DOCKER_HOST}
    life_harness: false
  transport:
    model_url: ${BENCH_CHAT_URL}
    tokenizer_url: ${BENCH_TOKENIZER_URL}
    max_context_tokens: 32768
    max_output_tokens: 4096
    request_timeout_seconds: 575
    transport_retries: 2
    max_model_calls: 16
name: osbench-frozen
mode: frozen
checkpoint: v01
harness_api: interface.md
test_schedule: artifact
