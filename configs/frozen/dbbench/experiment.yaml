domain: DBBench
node: node
baseline: baseline
runtime: runtime
output: runs
benchmark:
  kind: python
  test: test.jsonl
  direction: maximize
  success_score: 1
  concurrency: 12
  max_steps: 100000
  max_model_calls: 15
  timeout_seconds: 1500
  no_tool_feedback: No executable tool calls found. Please call a tool.
  model:
    name: Qwen3-4B-Instruct-2507
    base_url: ${BENCH_BASE_URL}
    api_key_env: BENCH_API_KEY
    temperature: 0
    max_tokens: 4096
    timeout_seconds: 740
    max_retries: 0
    send_seed: false
    extra_body:
      parallel_tool_calls: false
      chat_template_kwargs:
        enable_thinking: false
  environment:
    factory: environment.py:create_environment
    mysql_host: 127.0.0.1
    mysql_port: 13316
    mysql_password_env: MYSQL_PASSWORD
  runner: dbbench
  transport:
    model_url: ${BENCH_CHAT_URL}
    tokenizer_url: ${BENCH_TOKENIZER_URL}
    max_context_tokens: 32768
    max_output_tokens: 4096
    request_timeout_seconds: 240
    transport_retries: 2
    max_model_calls: 15
name: dbbench-frozen
mode: frozen
checkpoint: v35
harness_api: interface.md
test_schedule: artifact
