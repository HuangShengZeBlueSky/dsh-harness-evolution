domain: WebShop
node: node
baseline: baseline
runtime: runtime
output: runs
benchmark:
  kind: python
  test: test.jsonl
  direction: maximize
  success_score: 1
  concurrency: 12
  max_steps: 20
  max_model_calls: 20
  timeout_seconds: 900
  no_tool_feedback: You must call a tool! NEVER respond with only text.
  model:
    name: Qwen3-4B-Instruct-2507
    base_url: ${BENCH_BASE_URL}
    api_key_env: BENCH_API_KEY
    temperature: 0
    max_tokens: 4096
    timeout_seconds: 180
    max_retries: 2
    send_seed: false
    extra_body:
      parallel_tool_calls: false
      chat_template_kwargs:
        enable_thinking: false
  environment:
    factory: environment.py:create_environment
    url: ${WEBSHOP_URL}
    system_prompt_file: system-prompt.txt
    tools_file: tools.json
  runner: webshop
name: webshop-frozen
mode: frozen
checkpoint: v12
harness_api: interface.md
test_schedule: artifact
