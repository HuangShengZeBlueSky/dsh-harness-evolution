name: webshop-C-sol61
method: astra_autonomous
output: runs
rounds: 40
node: node
baseline: baseline
runtime: runtime
harness_api: interface.md
min_improvement: 0
test_schedule: sealed_all_promoted
optimizer:
  command:
  - codex
  model: gpt-6.1-sol
  effort: high
benchmark:
  kind: python
  train: batches/batch-01.jsonl
  test: test.jsonl
  direction: maximize
  success_score: 1
  concurrency: 4
  max_steps: 20
  max_model_calls: 20
  timeout_seconds: 900
  no_tool_feedback: You must call a tool! NEVER respond with only text.
  model:
    name: Qwen3-4B-Instruct-2507
    base_url: ${BENCH_BASE_URL}
    api_key_env: BENCH_API_KEY
    temperature: 0
    max_tokens: 4096
    timeout_seconds: 180
    max_retries: 2
    send_seed: false
    extra_body:
      parallel_tool_calls: false
      chat_template_kwargs:
        enable_thinking: false
  environment:
    factory: environment.py:create_environment
    url: ${WEBSHOP_URL}
    system_prompt_file: system-prompt.txt
    tools_file: tools.json
    environment_id: webshop-fixed-stage2-20261102
    fault_log: infrastructure-errors.jsonl
  train_batches:
  - batches/batch-01.jsonl
  - batches/batch-02.jsonl
  - batches/batch-03.jsonl
  - batches/batch-04.jsonl
  - batches/batch-05.jsonl
  - batches/batch-06.jsonl
domain: webshop
start_label: "\u65E7\u6700\u7EC8\u7248 v37"
scale:
  mode: C
  selection: mean_reward
  data: historical
  benchmark: webshop
