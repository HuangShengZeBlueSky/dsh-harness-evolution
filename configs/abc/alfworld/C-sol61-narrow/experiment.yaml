name: alfworld-C-sol61-narrow
method: astra_autonomous
output: runs
rounds: 40
node: node
baseline: baseline
runtime: runtime
harness_api: interface.md
min_improvement: 0
test_schedule: sealed_all_promoted
optimizer:
  command:
  - codex
  model: gpt-6.1-sol
  effort: high
benchmark:
  kind: python
  train: batches/batch-01.jsonl
  test: test.jsonl
  direction: maximize
  success_score: 1
  concurrency: 4
  max_steps: 50
  max_model_calls: 50
  timeout_seconds: 1500
  no_tool_feedback: "You MUST call the take_action tool \u2014 do NOT output plain\
    \ text without a tool call."
  model:
    name: Qwen3-4B-Instruct-2507
    base_url: ${BENCH_BASE_URL}
    api_key_env: BENCH_API_KEY
    temperature: 0
    max_tokens: 4096
    timeout_seconds: 180
    max_retries: 2
    send_seed: false
    extra_body:
      parallel_tool_calls: false
  environment:
    factory: environment.py:create_environment
    data_root: ${ALFWORLD_DATA_ROOT}
    system_prompt_file: system-prompt.txt
  train_batches:
  - batches/batch-01.jsonl
  - batches/batch-02.jsonl
domain: alfworld
scale:
  mode: C
  selection: strict_success
  data: narrow
  benchmark: alfworld
