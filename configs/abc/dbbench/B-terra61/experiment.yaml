name: dbbench-B-terra61
method: astra_autonomous
output: runs
rounds: 40
node: node
baseline: baseline
runtime: runtime
harness_api: interface.md
min_improvement: 0
test_schedule: sealed_all_promoted
optimizer:
  command:
  - codex
  model: gpt-6.1-terra
  effort: high
benchmark:
  kind: python
  train: batches/batch-01.jsonl
  test: test.jsonl
  direction: maximize
  success_score: 1
  concurrency: 4
  max_steps: 100000
  max_model_calls: 15
  timeout_seconds: 1500
  no_tool_feedback: No executable tool calls found. Please call a tool.
  model:
    name: Qwen3-4B-Instruct-2507
    base_url: ${BENCH_BASE_URL}
    api_key_env: BENCH_API_KEY
    temperature: 0
    max_tokens: 4096
    timeout_seconds: 740
    max_retries: 0
    send_seed: false
    extra_body:
      parallel_tool_calls: false
      chat_template_kwargs:
        enable_thinking: false
  environment:
    factory: environment.py:create_environment
    mysql_host: 127.0.0.1
    mysql_port: 13316
    mysql_password_env: MYSQL_PASSWORD
  train_batches:
  - batches/batch-01.jsonl
  - batches/batch-02.jsonl
  - batches/batch-03.jsonl
  - batches/batch-04.jsonl
  - batches/batch-05.jsonl
  - batches/batch-06.jsonl
  transport:
    model_url: ${BENCH_CHAT_URL}
    tokenizer_url: ${BENCH_TOKENIZER_URL}
    max_context_tokens: 32768
    max_output_tokens: 4096
    request_timeout_seconds: 240
    transport_retries: 2
    max_model_calls: 15
  runner: dbbench
domain: dbbench
start_label: "H0\u96F6\u589E\u5F3A\u63D2\u4EF6"
scale:
  mode: B
  selection: strict_success
  data: historical
  benchmark: dbbench
