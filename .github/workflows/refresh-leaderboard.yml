name: Refresh results and publish research explorer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'results/**'
      - 'harnesses/**'
      - 'research-artifacts/**'
      - 'evolution/**'
      - 'tools/**'
      - 'site/**'
      - '.github/workflows/refresh-leaderboard.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: published-research
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python tools/build.py
      - name: Commit regenerated public views
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README*.md LEADERBOARD*.md docs results/leaderboard.json harnesses assets site
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published methods, leaderboard and curves'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish research explorer
        id: deployment
        uses: actions/deploy-pages@v4
