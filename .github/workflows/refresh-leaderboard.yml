name: Build paper results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['paper/**', 'harnesses/**', 'configs/**', 'evolution/**', 'tools/**', '.github/workflows/refresh-leaderboard.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: paper-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
