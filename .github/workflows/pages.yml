name: Publish HookEvo project page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', 'figures/**', 'scripts/render_citation.py', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: paper-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/render_citation.py website
      - run: cp -R figures website/
      - uses: actions/configure-pages@v5
      - id: bundle
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
          name: ${{ steps.bundle.outputs.name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
